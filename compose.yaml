services:
  mongo-keyfile:
    image: alpine:3.22
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "head -c 756 /dev/urandom | base64 > /keyfile/mongodb-keyfile && chown 999:999 /keyfile/mongodb-keyfile && chmod 400 /keyfile/mongodb-keyfile",
      ]
    volumes:
      - mongo-keyfile:/keyfile

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-local-root-password}
      TEAM_CONTEXT_MONGODB_DATABASE: ${TEAM_CONTEXT_MONGODB_DATABASE:-team_context}
      TEAM_CONTEXT_MONGODB_USERNAME: ${TEAM_CONTEXT_MONGODB_USERNAME:-team_context_service}
      TEAM_CONTEXT_MONGODB_PASSWORD: ${TEAM_CONTEXT_MONGODB_PASSWORD:-local-context-password}
      AGENT_RUNTIME_MONGODB_DATABASE: ${AGENT_RUNTIME_MONGODB_DATABASE:-agent_runtime}
      AGENT_RUNTIME_MONGODB_USERNAME: ${AGENT_RUNTIME_MONGODB_USERNAME:-team_agent_service}
      AGENT_RUNTIME_MONGODB_PASSWORD: ${AGENT_RUNTIME_MONGODB_PASSWORD:-local-runtime-password}
    command:
      [
        "mongod",
        "--replSet",
        "team-agent-rs",
        "--bind_ip_all",
        "--keyFile",
        "/keyfile/mongodb-keyfile",
      ]
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_ROOT_USERNAME:-root}",
          "--password",
          "${MONGO_ROOT_PASSWORD:-local-root-password}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - team-context-data:/data/db
      - mongo-keyfile:/keyfile:ro
      - ./ops/mongo/init-users.js:/docker-entrypoint-initdb.d/init-users.js:ro

  mongo-replica-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh"]
    command:
      [
        "mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-local-root-password}@mongo:27017/admin?authSource=admin&directConnection=true",
        "--quiet",
        "--eval",
        "try { rs.status().ok } catch (error) { rs.initiate({_id:'team-agent-rs',members:[{_id:0,host:'mongo:27017'}]}).ok }",
      ]

  team-context:
    build:
      context: .
      target: team-context
    environment:
      HTTP_PORT: 3000
      CONTENT_PATH: /app/extension
      CONTENT_REVISION: ${CONTENT_REVISION:-local-example}
      TEAM_AGENT_ALLOW_MUTABLE_CONTENT_REVISION: ${TEAM_AGENT_ALLOW_MUTABLE_CONTENT_REVISION:-true}
      TEAM_AGENT_BOOTSTRAP_CONTENT_ON_STARTUP: ${TEAM_AGENT_BOOTSTRAP_CONTENT_ON_STARTUP:-true}
      DEV_AUTH_PRINCIPALS: '${DEV_AUTH_PRINCIPALS:-{"dev-token":{"id":"local-developer","groups":["engineering"],"projects":["event-ingestion"],"roles":[]}}}'
      TEAM_CONTEXT_MONGODB_URI: mongodb://${TEAM_CONTEXT_MONGODB_USERNAME:-team_context_service}:${TEAM_CONTEXT_MONGODB_PASSWORD:-local-context-password}@mongo:27017/${TEAM_CONTEXT_MONGODB_DATABASE:-team_context}?authSource=${TEAM_CONTEXT_MONGODB_DATABASE:-team_context}&replicaSet=team-agent-rs
      TEAM_CONTEXT_MONGODB_DATABASE: ${TEAM_CONTEXT_MONGODB_DATABASE:-team_context}
      AGENT_RUNTIME_MONGODB_DATABASE: ${AGENT_RUNTIME_MONGODB_DATABASE:-agent_runtime}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-replica-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  team-context-data:
  mongo-keyfile:
