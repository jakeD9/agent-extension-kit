[project]
name = "team-agent-context"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "mcp>=2,<3",
  "pydantic>=2.12.0,<3",
  "team-agent-contracts",
]

[project.scripts]
team-context = "team_agent_context.cli:main"
team-context-mcp = "team_agent_context.mcp:main"

[tool.uv.sources]
team-agent-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"
